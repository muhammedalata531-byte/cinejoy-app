name: Build CineJoy Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK with Gradle
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CineJoy-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineJoy-App
          path: CineJoy-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: CineJoy App v1.0 (Build #${{ github.run_number }})
          body: |
            ## CineJoy Android App
            اضغط على رابط التحميل المباشر أدناه لتثبيت التطبيق على جوالك:
            - **CineJoy-v1.0.apk**
          files: CineJoy-v1.0.apk
          draft: false
          prerelease: false
